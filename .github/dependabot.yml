# Dependabot watches only GitHub Actions in this repo as a backstop.
# Renovate itself manages everything else via the self-renovate config.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Hong_Kong
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5
